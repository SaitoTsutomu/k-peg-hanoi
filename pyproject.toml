[project]
authors = [{name = "Saito Tsutomu", email = "tsutomu7@hotmail.co.jp"}]
classifiers = [
  "Development Status :: 1 - Planning",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python",
  "Topic :: Software Development",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "fire>=0.7.1",
]
description = "Tower of Hanoi (using k peg)"
license = {text = "Apache-2.0"}
name = "k-peg-hanoi"
readme = "README.md"
requires-python = ">=3.11"
version = "0.2.5"

[project.scripts]
hanoi = "k_peg_hanoi:main"

[project.urls]
docs = "https://saitotsutomu.github.io/k-peg-hanoi/"
homepage = "https://github.com/SaitoTsutomu/k-peg-hanoi"

[dependency-groups]
dev = [
  "pytest>=9.0.3",
  "pytest-snapshot>=0.9.0",
]

[tool.taskipy.tasks]
license = "uv run -w pip-licenses pip-licenses"
lint = "pyrefly check src && ruff check src"
test = "uv run pytest"

[tool.uv]
exclude-newer = "3 days"

[[tool.uv.index]]
default = true
url = "https://pypi.flatt.tech/simple/"

[tool.mypy]
files = "src"
ignore_missing_imports = true

[tool.pyrefly]
project-includes = ["src"]

[tool.ruff]
src = ["src"]

[tool.ruff.lint]
ignore = ["ANN", "CPY", "D", "DOC", "line-too-long", "magic-value-comparison", "print"]
preview = true
select = ["ALL"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[build-system]
build-backend = "uv_build"
requires = ["uv_build>=0.12.0,<0.13.0"]
