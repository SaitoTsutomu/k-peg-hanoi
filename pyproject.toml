[project]
authors = [{name = "Saito Tsutomu", email = "tsutomu7@hotmail.co.jp"}]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Topic :: Software Development",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "typer>=0.27.3",
]
description = "Tower of Hanoi (using k peg)"
license = "Apache-2.0"
license-files = ["LICENSE"]
name = "k-peg-hanoi"
readme = "README.md"
requires-python = ">=3.11"
version = "0.2.6"

[project.scripts]
hanoi = "k_peg_hanoi:main"

[project.urls]
docs = "https://saitotsutomu.github.io/k-peg-hanoi/"
homepage = "https://github.com/SaitoTsutomu/k-peg-hanoi"

[dependency-groups]
dev = [
  "pytest>=9.2",
  "syrupy>=6.1",
]

[tool.taskipy.tasks]
gh-deploy = "uvx -w mkdocs-material,mkdocstrings-python mkdocs gh-deploy"
license = "uv run -w pip-licenses pip-licenses"
lint = "pyrefly check src && ruff check src"
test = "uv run pytest"

[tool.uv]
exclude-newer = "3 days"

[[tool.uv.index]]
default = true
url = "https://pypi.flatt.tech/simple/"

[tool.pyrefly]
project-includes = ["src"]

[tool.ruff]
src = ["src"]

[tool.ruff.lint]
ignore = ["ANN", "CPY", "D", "DOC", "line-too-long", "magic-value-comparison", "print"]
preview = true
select = ["ALL"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[build-system]
build-backend = "uv_build"
requires = ["uv_build>=0.13.3,<0.14.0"]
