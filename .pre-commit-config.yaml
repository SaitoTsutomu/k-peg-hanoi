repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uvx ruff check src
        language: system
        pass_filenames: false
        types: [python]
      - id: pyrefly
        name: pyrefly
        entry: uvx pyrefly check src
        language: system
        pass_filenames: false
        types: [python]
      - id: pytest
        name: pytest
        entry: uv run pytest
        language: system
        pass_filenames: false
        types: [python]
